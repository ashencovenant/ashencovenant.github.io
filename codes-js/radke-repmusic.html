<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://kit-pro.fontawesome.com/releases/v6.0.0-beta3/css/pro.min.css">
  <style>
    body { margin: 0; padding: 0; background: transparent; }

    .ac-musicplayer {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: transparent;
      padding: 0;
    }

    #ac-musictrigger { display: none !important; }

    .ac-playbtn i {
      color: var(--color-thumb, #bbb9b9);
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.2s ease;
      line-height: 1;
    }
    .ac-playbtn i:hover { transform: scale(1.1); }

    .icon-play { display: inline-block !important; }
    .icon-pause { display: none !important; }

    #ac-musictrigger:checked + .ac-playbtn .icon-play { display: none !important; }
    #ac-musictrigger:checked + .ac-playbtn .icon-pause { display: inline-block !important; }

    .ac-seekbar {
      -webkit-appearance: none;
      appearance: none;
      width: 110px;
      height: 4px;
      background: #444; 
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    .ac-seekbar::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--color-thumb, #bbb9b9); 
      cursor: pointer;
      border: none;
    }

    .ac-seekbar::-moz-range-thumb {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--color-thumb, #bbb9b9); 
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="ac-musicplayer">
    <audio id="ac-audio"></audio>
    <input type="checkbox" id="ac-musictrigger">
    <label for="ac-musictrigger" class="ac-playbtn">
      <i class="fa-solid fa-play icon-play"></i>
      <i class="fa-solid fa-pause icon-pause"></i>
    </label>
    <input type="range" class="ac-seekbar" value="0" max="100">
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const audioUrl = params.get('song');
    
    let colorHex_cm2 = params.get('cm2') || params.get('color') || 'bbb9b9';
    let colorHex_cm1 = params.get('cm1') || colorHex_cm2;

    colorHex_cm1 = colorHex_cm1.replace('#', '');
    colorHex_cm2 = colorHex_cm2.replace('#', '');

    document.documentElement.style.setProperty('--color-thumb', '#' + colorHex_cm1);
    
    const audio = document.getElementById('ac-audio');
    const trigger = document.getElementById('ac-musictrigger');
    const seekbar = document.querySelector('.ac-seekbar');

    if (audioUrl) { audio.src = audioUrl; }

    trigger.addEventListener('change', () => {
      trigger.checked ? audio.play() : audio.pause();
    });

    function updateBarBackground(value) {
      seekbar.style.background = `linear-gradient(to right, #${colorHex_cm2} ${value}%, #444 ${value}%)`;
    }

    updateBarBackground(0);

    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      const pct = (audio.currentTime / audio.duration) * 100;
      seekbar.value = pct;
      updateBarBackground(pct);
    });

    seekbar.addEventListener('input', () => {
      if (!audio.duration) return;
      updateBarBackground(seekbar.value);
    });

    seekbar.addEventListener('change', () => {
      if (!audio.duration) return;
      audio.currentTime = (seekbar.value / 100) * audio.duration;
    });

    audio.addEventListener('ended', () => {
      trigger.checked = false;
      seekbar.value = 0;
      updateBarBackground(0);
    });
  </script>
</body>
</html>
