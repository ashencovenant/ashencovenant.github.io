<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://kit-pro.fontawesome.com/releases/v6.0.0-beta3/css/pro.min.css">
  <style>
    #ac-mm03-musictrigger { display: none !important; }

    .ac-mm03-playbtn i {
      color: var(--pptradke-cm2, #bbb9b9);
      font-size: var(--play-size, 24px);
      cursor: pointer;
      transition: transform 0.2s ease;
      line-height: 1;
      display: inline-block;
    }
    .ac-mm03-playbtn i:hover { transform: scale(1.15); }

    .ac-mm03-heart-wrapper {
      display: none;
      position: relative;
      cursor: pointer;
      font-size: var(--play-size, 24px);
      line-height: 1;
      transition: transform 0.2s ease;
      width: 1em;
      height: 1em;
    }
    .ac-mm03-heart-wrapper:hover { transform: scale(1.15); }

    .ac-mm03-heart-bg {
      position: absolute;
      top: 0;
      left: 0;
      color: #444;
      display: block;
      line-height: 1;
    }

    .ac-mm03-heart-fill {
      position: absolute;
      top: 0;
      left: 0;
      color: var(--pptradke-cm2, #bbb9b9);
      line-height: 1;
      clip-path: inset(100% 0 0 0);
      transition: clip-path 0.1s linear;
    }

    #ac-mm03-musictrigger:checked + label .ac-mm03-playbtn { display: none !important; }
    #ac-mm03-musictrigger:checked + label .ac-mm03-heart-wrapper { display: inline-block !important; }
  </style>
</head>
<body>

  <div class="ac-mm03-player-card">
    <audio id="ac-mm03-audio"></audio>

    <input type="checkbox" id="ac-mm03-musictrigger">
    <label for="ac-mm03-musictrigger">
      <span class="ac-mm03-playbtn">
        <i class="fa-solid fa-play"></i>
      </span>

      <span class="ac-mm03-heart-wrapper">
        <i class="fa-light fa-heart ac-mm03-heart-bg" id="icon-bg"></i>
        <i class="fa-solid fa-heart ac-mm03-heart-fill" id="icon-fill"></i>
      </span>
    </label>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const audioUrl = params.get('song');
    let colorHex = params.get('cm2') || params.get('color') || 'bbb9b9';
    let playSize = params.get('ps') || '24px';
    let customIcon = params.get('icon') || 'fa-heart';

    colorHex = colorHex.replace('#', '');
    document.documentElement.style.setProperty('--pptradke-cm2', '#' + colorHex);
    document.documentElement.style.setProperty('--play-size', playSize.includes('px') ? playSize : playSize + 'px');

    const audio = document.getElementById('ac-mm03-audio');
    const trigger = document.getElementById('ac-mm03-musictrigger');
    const iconBg = document.getElementById('icon-bg');
    const iconFill = document.getElementById('icon-fill');

    iconBg.className = `fa-light ${customIcon} ac-mm03-heart-bg`;
    iconFill.className = `fa-solid ${customIcon} ac-mm03-heart-fill`;

    if (audioUrl) { audio.src = audioUrl; }

    trigger.addEventListener('change', () => {
      trigger.checked ? audio.play() : audio.pause();
    });

    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      const pct = (audio.currentTime / audio.duration) * 100;
      
      const insetTop = 100 - pct;
      iconFill.style.clipPath = `inset(${insetTop}% 0 0 0)`;
    });

    audio.addEventListener('ended', () => {
      trigger.checked = false;
      iconFill.style.clipPath = `inset(100% 0 0 0)`;
    });
  </script>
</body>
</html>
