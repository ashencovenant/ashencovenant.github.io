<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://kit-pro.fontawesome.com/releases/v6.0.0-beta3/css/pro.min.css">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      overflow: hidden !important;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .ac-mmes03-player-card {
      width: 100vw;
      height: 100vh;
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
    }

    .ac-mmes03-controls {
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      width: 100%;
      height: 100%;
    }

    #ac-mmes03-musictrigger { display: none !important; }

    .ac-mmes03-playbtn {
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .ac-mmes03-playbtn i {
      color: var(--color-icon, var(--pptradke-cm2, #bbb9b9));
      font-size: var(--play-size, 20px);
      line-height: 1 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      transition: transform 0.2s ease;
    }

    .ac-mmes03-playbtn i:hover { transform: scale(1.15); }

    .icon-play { display: flex !important; }
    .icon-pause { display: none !important; }

    #ac-mmes03-musictrigger:checked + .ac-mmes03-playbtn .icon-play { display: none !important; }
    #ac-mmes03-musictrigger:checked + .ac-mmes03-playbtn .icon-pause { display: flex !important; }
  </style>
</head>
<body>

  <div class="ac-mmes03-player-card">
    <audio id="ac-mmes03-audio"></audio>

    <div class="ac-mmes03-controls">
      <input type="checkbox" id="ac-mmes03-musictrigger">
      <label for="ac-mmes03-musictrigger" class="ac-mmes03-playbtn">
        <i class="fa-solid fa-play icon-play" id="play-icon"></i>
        <i class="fa-solid fa-pause icon-pause"></i>
      </label>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const audioUrl = params.get('song');

    let colorHex_cm2 = params.get('cm2') || params.get('color') || 'bbb9b9';
    let colorHex_cm1 = params.get('cm1') || colorHex_cm2;
    let playSize = params.get('ps') || '20px';
    let customIcon = params.get('icon') || 'fa-play';

    colorHex_cm1 = colorHex_cm1.replace('#', '');
    colorHex_cm2 = colorHex_cm2.replace('#', '');

    document.documentElement.style.setProperty('--color-icon', '#' + colorHex_cm1);
    document.documentElement.style.setProperty('--pptradke-cm2', '#' + colorHex_cm2);
    document.documentElement.style.setProperty('--play-size', playSize.includes('px') ? playSize : playSize + 'px');

    const playIconElement = document.getElementById('play-icon');
    
    if (playIconElement) {
      playIconElement.className = `fa-solid ${customIcon} icon-play`;
      if (customIcon === 'fa-play') {
        playIconElement.style.marginLeft = '2px';
      } else {
        playIconElement.style.marginLeft = '0px';
      }
    }

    const playBtnIcons = document.querySelectorAll('.ac-mmes03-playbtn i');
    playBtnIcons.forEach(i => i.style.fontSize = playSize.includes('px') ? playSize : playSize + 'px');

    const audio = document.getElementById('ac-mmes03-audio');
    const trigger = document.getElementById('ac-mmes03-musictrigger');

    if (audioUrl) { audio.src = audioUrl; }

    trigger.addEventListener('change', () => {
      trigger.checked ? audio.play() : audio.pause();
    });

    audio.addEventListener('ended', () => {
      trigger.checked = false;
    });
  </script>
</body>
</html>
