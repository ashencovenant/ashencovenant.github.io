<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://kit-pro.fontawesome.com/releases/v6.0.0-beta3/css/pro.min.css">
  <style>
    .ac-mm01-player-card {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .ac-mm01-progress-container {
      position: relative;
      width: 100%;
      height: 20px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .ac-mm01-track {
      position: absolute;
      width: 100%;
      height: var(--bar-height, 4px);
      background: #444;
      border-radius: 10px;
      overflow: hidden;
      top: 50%;
      transform: translateY(-50%);
    }

    .ac-mm01-fill {
      width: 0%;
      height: 100%;
      background: var(--pptradke-cm2, #bbb9b9);
      border-radius: 10px;
    }

    .ac-mm01-thumb-icon {
      position: absolute;
      left: 0%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: var(--color-thumb, #bbb9b9);
      font-size: var(--thumb-size, 12px);
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 2;
    }

    .ac-mm01-time-container {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--time-color, #bbb9b9);
      margin-top: 2px;
      margin-bottom: 8px;
    }

    .ac-mm01-controls {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #ac-mm01-musictrigger { display: none !important; }

    .ac-mm01-playbtn i {
      color: var(--color-thumb, #bbb9b9);
      font-size: 20px;
      cursor: pointer;
      transition: transform 0.2s ease;
      line-height: 1;
    }
    .ac-mm01-playbtn i:hover { transform: scale(1.15); }

    .icon-play { display: inline-block !important; }
    .icon-pause { display: none !important; }

    #ac-mm01-musictrigger:checked + .ac-mm01-playbtn .icon-play { display: none !important; }
    #ac-mm01-musictrigger:checked + .ac-mm01-playbtn .icon-pause { display: inline-block !important; }
  </style>
</head>
<body>

  <div class="ac-mm01-player-card">
    <audio id="ac-mm01-audio"></audio>

    <div class="ac-mm01-progress-container" id="progress-container">
      <div class="ac-mm01-track">
        <div class="ac-mm01-fill" id="progress-fill"></div>
      </div>
      <i class="fa-solid fa-circle ac-mm01-thumb-icon" id="thumb-icon"></i>
    </div>

    <div class="ac-mm01-time-container">
      <span id="time-current">0:00</span>
      <span id="time-total">0:00</span>
    </div>

    <div class="ac-mm01-controls">
      <input type="checkbox" id="ac-mm01-musictrigger">
      <label for="ac-mm01-musictrigger" class="ac-mm01-playbtn">
        <i class="fa-solid fa-play icon-play"></i>
        <i class="fa-solid fa-pause icon-pause"></i>
      </label>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const audioUrl = params.get('song');
    
    let colorHex_cm2 = params.get('cm2') || params.get('color') || 'bbb9b9';
    let colorHex_cm1 = params.get('cm1') || colorHex_cm2;

    let timeColorHex = params.get('tc') || colorHex_cm2;
    let barHeight = params.get('bh') || '4px';
    let thumbSize = params.get('ts') || '12px';
    let playSize = params.get('ps') || '20px';
    let customIcon = params.get('icon') || 'fa-circle';

    colorHex_cm1 = colorHex_cm1.replace('#', '');
    colorHex_cm2 = colorHex_cm2.replace('#', '');
    timeColorHex = timeColorHex.replace('#', '');

    document.documentElement.style.setProperty('--color-thumb', '#' + colorHex_cm1);
    document.documentElement.style.setProperty('--pptradke-cm2', '#' + colorHex_cm2);
    document.documentElement.style.setProperty('--time-color', '#' + timeColorHex);
    document.documentElement.style.setProperty('--bar-height', barHeight.includes('px') ? barHeight : barHeight + 'px');
    document.documentElement.style.setProperty('--thumb-size', thumbSize.includes('px') ? thumbSize : thumbSize + 'px');

    const playBtnIcon = document.querySelectorAll('.ac-mm01-playbtn i');
    playBtnIcon.forEach(i => i.style.fontSize = playSize.includes('px') ? playSize : playSize + 'px');

    const audio = document.getElementById('ac-mm01-audio');
    const trigger = document.getElementById('ac-mm01-musictrigger');
    const container = document.getElementById('progress-container');
    const fill = document.getElementById('progress-fill');
    const thumb = document.getElementById('thumb-icon');
    const timeCurrent = document.getElementById('time-current');
    const timeTotal = document.getElementById('time-total');

    thumb.className = `fa-solid ${customIcon} ac-mm01-thumb-icon`;

    if (audioUrl) { audio.src = audioUrl; }

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds === Infinity) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    audio.addEventListener('loadedmetadata', () => {
      timeTotal.textContent = formatTime(audio.duration);
    });

    trigger.addEventListener('change', () => {
      trigger.checked ? audio.play() : audio.pause();
    });

    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      const pct = (audio.currentTime / audio.duration) * 100;
      fill.style.width = `${pct}%`;
      thumb.style.left = `${pct}%`;

      timeCurrent.textContent = formatTime(audio.currentTime);
      if (timeTotal.textContent === "0:00" && audio.duration) {
        timeTotal.textContent = formatTime(audio.duration);
      }
    });

    function setAudioPosition(e) {
      if (!audio.duration) return;
      const rect = container.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const width = rect.width;
      const pct = Math.max(0, Math.min(100, (clickX / width) * 100));
      
      audio.currentTime = (pct / 100) * audio.duration;
      fill.style.width = `${pct}%`;
      thumb.style.left = `${pct}%`;
    }

    let isDragging = false;
    container.addEventListener('mousedown', (e) => { isDragging = true; setAudioPosition(e); });
    window.addEventListener('mousemove', (e) => { if (isDragging) setAudioPosition(e); });
    window.addEventListener('mouseup', () => { isDragging = false; });

    audio.addEventListener('ended', () => {
      trigger.checked = false;
      fill.style.width = '0%';
      thumb.style.left = '0%';
      timeCurrent.textContent = "0:00";
    });
  </script>
</body>
</html>
